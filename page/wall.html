<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ringtop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070a1c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%238b7dff' stroke-width='3.5' stroke-dasharray='11 3.1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="page/wall.css">
</head>
<body>
<div class="wall" id="wall">
  <header><div id="link"><i></i><span>Connecting</span></div><span id="demo" hidden title="Demo mode: ringtop makes up the Sparks, numbers and load, and reads nothing from a Spark. To see a real cluster, start ringtop without --demo.">Demo: not a real cluster</span><button id="names" type="button" aria-pressed="false"></button></header>
  <section id="speed" class="wordy" aria-label="Speed">
    <div class="pill"><i id="core-dot"></i><span id="core-state">Connecting</span></div>
    <div class="num"><span id="core-num"></span><small id="core-unit"></small></div>
    <p id="core-sub"></p>
  </section>
  <section id="now" aria-label="Run">
    <div class="runhead"><h2 id="run-name"></h2><span id="run-count"></span></div>
    <div class="track" id="run-track" hidden><i id="run-fill"></i></div>
    <p id="run-time"></p>
  </section>
  <section id="tiles" aria-label="Sparks"></section>
  <footer><p id="power"></p><p id="about" hidden></p></footer>
</div>
<script src="page/base.js"></script>
<script src="page/rules.js"></script>
<script src="page/neutral.js"></script>
<script src="page/faces.js"></script>
<script src="page/wall.js"></script>
</body>
</html>
